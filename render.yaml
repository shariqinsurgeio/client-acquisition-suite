# Render Blueprint - Client Acquisition Suite
# https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: client-acquisition-suite
    runtime: node
    region: oregon
    plan: starter
    rootDir: apps/web
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard (Neon connection string)
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        value: /
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: client-acquisition-suite
          property: host
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: client-acquisition-suite
          property: host

# Database: Using Neon PostgreSQL (free forever)
# Set DATABASE_URL manually in Render dashboard with your Neon connection string
# Example: postgresql://user:pass@ep-xxx.us-east-2.aws.neon.tech/dbname?sslmode=require
